kind: flow
name: network-recon
description: Unified IP and CIDR reconnaissance with lite, standard, and extensive profiles
tags: core, recon, network, cidr
help:
  example_targets: ['192.0.2.10', '192.0.2.0/28']
  usage: |
    osmedeus run -f network-recon -t 192.0.2.10
    osmedeus run -f network-recon -t 192.0.2.0/28 -p 'profile=extensive'

params:
  - name: profile
    type: string
    default: standard

dependencies:
  variables:
    - name: Target
      type: cidr,ip,file
      required: true

modules:
  - name: probe-port-lite
    path: fragments/do-probe-port.yaml
    condition: profile === 'lite'
    params:
      commonHttpPorts: "80,443,8080,8443"
      commonHttpsPort: "443,8443"

  - name: probe-port-standard
    path: fragments/do-probe-port.yaml
    condition: profile === 'standard'

  - name: probe-port-extensive
    path: fragments/do-probe-port.yaml
    condition: profile === 'extensive'
    params:
      commonHttpPorts: "1-65535"
      commonHttpsPort: "1-65535"

  - name: recon-spider
    path: fragments/do-recon-spider.yaml
    depends_on: [probe-port-lite, probe-port-standard, probe-port-extensive]
    condition: profile !== 'lite'

  - name: scan-vuln
    path: fragments/do-scan-vuln.yaml
    depends_on: [probe-port-lite, probe-port-standard, probe-port-extensive]
    condition: profile !== 'lite'

  - name: scan-content
    path: fragments/do-scan-content.yaml
    depends_on: [probe-port-lite, probe-port-standard, probe-port-extensive]
    condition: profile !== 'lite'

  - name: scan-vuln-thorough
    path: fragments/do-scan-vuln-thorough.yaml
    depends_on: [probe-port-lite, probe-port-standard, probe-port-extensive]
    condition: profile === 'extensive'
