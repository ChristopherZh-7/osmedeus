name: Docker Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build metadata
        id: metadata
        shell: bash
        run: |
          version=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]*=[[:space:]]*"v([^"]+)".*/\1/p' internal/core/constants.go)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/christopherzh-7/golish-pentest-platform:latest
            ghcr.io/christopherzh-7/golish-pentest-platform:v${{ steps.metadata.outputs.version }}
          build-args: |
            BUILD_TIME=${{ steps.metadata.outputs.built_at }}
            COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
