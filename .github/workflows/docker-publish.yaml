name: Docker Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/christopherzh-7/golish-pentest-platform

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out source
        shell: bash
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Log in to GHCR
        shell: bash
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish architecture image
        shell: bash
        run: |
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker buildx build \
            --file build/docker/Dockerfile \
            --platform "linux/$ARCH" \
            --build-arg "BUILD_TIME=$built_at" \
            --build-arg "COMMIT_HASH=$GITHUB_SHA" \
            --tag "$IMAGE:build-$GITHUB_SHA-$ARCH" \
            --push \
            .

  publish-manifest:
    name: Publish multi-architecture manifest
    needs: build
    runs-on: ubuntu-latest
    env:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out source
        shell: bash
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Resolve version
        id: metadata
        shell: bash
        run: |
          version=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]*=[[:space:]]*"v([^"]+)".*/\1/p' internal/core/constants.go)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        shell: bash
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish and verify manifest
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:v$VERSION" \
            "$IMAGE:build-$GITHUB_SHA-amd64" \
            "$IMAGE:build-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:v$VERSION"
