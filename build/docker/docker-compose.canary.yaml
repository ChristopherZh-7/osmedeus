services:
  golish-canary:
    build:
      context: ../..
      dockerfile: build/docker/Dockerfile.canary
    container_name: golish-canary
    hostname: golish-canary
    volumes:
      - canary-workspaces:/root/workspaces-golish
      - canary-data:/root/golish-base
      - ../../platform/golish-workflow:/root/golish-base/workflows
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: "no"

volumes:
  canary-workspaces:
  canary-data:
