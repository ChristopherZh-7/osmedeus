# Osmedeus Production Stack with PostgreSQL
# ==========================================
# Usage:
#   make deploy
#
# The deploy helper generates credentials/config, builds every image, waits for
# health checks, and leaves only the Osmedeus server port published.

services:
  # PostgreSQL - Primary database for persistent storage
  postgres:
    image: postgres:16-alpine
    container_name: osmedeus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osmedeus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-osmedeus}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osmedeus} -d ${POSTGRES_DB:-osmedeus}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - osmedeus-network
    # Uncomment to expose PostgreSQL externally (not recommended for production)
    # ports:
    #   - "5432:5432"

  # Redis - Message queue for distributed task processing
  redis:
    image: redis:7-alpine
    container_name: osmedeus-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - osmedeus-network
    # Uncomment to expose Redis externally (not recommended for production)
    # ports:
    #   - "6379:6379"

  # DeepSeek Harness - interactive pentest agent runtime
  agent-harness:
    build:
      context: ../../platform/osmedeus-agent-harness
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: osmedeus-agent-harness:latest
    container_name: osmedeus-agent-harness
    restart: unless-stopped
    environment:
      - DSH_HOME=/home/node/.dsh
      - DSH_TELEMETRY_MODE=DISABLED
      - DSH_PERMISSION_MODE=${DSH_PERMISSION_MODE:-workspace-write}
      - OSM_DSH_HOST=0.0.0.0
      - OSM_DSH_PORT=3080
      - OSM_DSH_TRUSTED_HOST=agent-harness:3080
      - OSM_API_URL=http://server:8002
      - OSM_CYBERSTRIKE_SKILLS_DIR=/app/vendor/cyberstrike-skills
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    volumes:
      - agent-harness-data:/home/node/.dsh
      - workspaces:/osmedeus/workspaces:ro
    expose:
      - "3080"
    healthcheck:
      test: ["CMD", "node", "./scripts/check.mjs"]
      interval: 15s
      timeout: 6s
      start_period: 20s
      retries: 5
    networks:
      - osmedeus-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # Master Node - API server and task coordinator
  server:
    build:
      context: ../..
      dockerfile: build/docker/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: osmedeus:latest
    container_name: osmedeus-server
    restart: unless-stopped
    ports:
      - "${OSM_SERVER_PORT:-8002}:8002"
    environment:
      # These are passed to the container but config is read from mounted file
      - TZ=${TZ:-UTC}
    volumes:
      - osmedeus-data:/root/osmedeus-base
      - workspaces:/root/workspaces-osmedeus
      # Directory mount allows the server's atomic settings rename to persist.
      - "${OSM_SETTINGS_DIR:-.}:/root/osmedeus-settings"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-harness:
        condition: service_healthy
    command: ["serve", "--master"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - osmedeus-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Worker Nodes - Execute distributed scan tasks
  worker:
    build:
      context: ../..
      dockerfile: build/docker/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: osmedeus:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - osmedeus-data:/root/osmedeus-base
      - workspaces:/root/workspaces-osmedeus
      - "${OSM_SETTINGS_DIR:-.}:/root/osmedeus-settings:ro"
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_healthy
    command: ["worker", "join", "--redis-url", "redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379"]
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - osmedeus-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  postgres-data:
    driver: local
    name: osmedeus-postgres-data
  redis-data:
    driver: local
    name: osmedeus-redis-data
  osmedeus-data:
    driver: local
    name: osmedeus-app-data
  workspaces:
    driver: local
    name: osmedeus-workspaces
  agent-harness-data:
    driver: local
    name: osmedeus-agent-harness-data

networks:
  osmedeus-network:
    driver: bridge
    name: osmedeus-network
