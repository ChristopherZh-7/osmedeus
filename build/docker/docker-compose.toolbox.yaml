version: "3.8"

services:
  golish-toolbox:
    build:
      context: ../..
      dockerfile: build/docker/Dockerfile.toolbox
      args:
        VERSION: "5.0.0"
        BUILD_TIME: "${BUILD_TIME:-unknown}"
        COMMIT_HASH: "${COMMIT_HASH:-unknown}"
    image: golish-toolbox:latest
    container_name: golish-toolbox
    hostname: golish-toolbox
    volumes:
      # Persist workspaces and scan results
      - golish-workspaces:/root/workspaces-golish
      # Persist database
      - golish-data:/root/golish-base
    ports:
      - "8002:8002"
    environment:
      - GOLISH_BASE=/root/golish-base
    # Keep container running for interactive use
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  golish-workspaces:
  golish-data:
