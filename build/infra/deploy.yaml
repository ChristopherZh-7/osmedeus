---
# Golish Single-Host Deployment Playbook
# ==========================================
# Deploys Golish on Ubuntu/Debian using the official install script.
#
# Usage:
#   ansible-playbook -i inventory.ini deploy.yaml
#
#   # With custom variables:
#   ansible-playbook -i inventory.ini deploy.yaml \
#     -e golish_admin_password=MySecurePass123 \
#     -e golish_server_port=9090
#
#   # Dry run:
#   ansible-playbook -i inventory.ini deploy.yaml --check

- name: Deploy Golish
  hosts: golish
  become: true

  vars:
    # --- Installation ---
    golish_user: root
    golish_install_dir: /root/.golish/binaries
    golish_base_dir: /root/golish-base
    golish_workspaces_dir: /root/workspaces-golish

    # --- Server ---
    golish_server_host: "0.0.0.0"
    golish_server_port: 8002
    golish_admin_user: admin
    golish_admin_password: "CHANGE_ME_ADMIN_PASSWORD"
    golish_jwt_secret: "CHANGE_ME_JWT_SECRET_MIN_32_CHARS"
    golish_jwt_expiration_minutes: 1440

    # --- Scan Threads ---
    golish_threads_aggressive: 50
    golish_threads_default: 20
    golish_threads_gently: 5

    # --- Systemd ---
    golish_enable_service: true

    # --- Notifications (optional) ---
    golish_telegram_enabled: false
    golish_telegram_bot_token: ""
    golish_telegram_chat_id: ""

    # --- Global Variables (optional) ---
    # Example:
    #   golish_global_variables:
    #     - name: GITHUB_API_KEY
    #       value: "ghp_xxxx"
    #       as_env: true
    golish_global_variables: []

  tasks:
    # =========================================================================
    # 1. System Prerequisites
    # =========================================================================
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install system dependencies
      ansible.builtin.apt:
        name:
          - curl
          - tmux
          - git
          - unzip
          - jq
          - chromium-browser
          - python3
        state: present

    # =========================================================================
    # 2. Install Golish
    # =========================================================================
    - name: Check if golish is already installed
      ansible.builtin.stat:
        path: "{{ golish_install_dir }}/golish"
      register: golish_binary

    - name: Install golish via official install script
      ansible.builtin.shell: |
        curl -fsSL https://raw.githubusercontent.com/ChristopherZh-7/golish-registry/main/install.sh | bash
      args:
        creates: "{{ golish_install_dir }}/golish"
      when: not golish_binary.stat.exists

    - name: Ensure golish binary is in PATH
      ansible.builtin.shell: |
        golish install env
      changed_when: false

    # =========================================================================
    # 3. Configure
    # =========================================================================
    - name: Create workspaces directory
      ansible.builtin.file:
        path: "{{ golish_workspaces_dir }}"
        state: directory
        owner: "{{ golish_user }}"
        mode: "0755"

    - name: Deploy golish-settings.yaml
      ansible.builtin.template:
        src: templates/golish-settings.yaml.j2
        dest: "{{ golish_base_dir }}/golish-settings.yaml"
        owner: "{{ golish_user }}"
        mode: "0600"
      notify: restart golish

    # =========================================================================
    # 4. Verify Installation
    # =========================================================================
    - name: Run golish health check
      ansible.builtin.command: "{{ golish_install_dir }}/golish health"
      register: health_result
      changed_when: false

    - name: Show health check output
      ansible.builtin.debug:
        var: health_result.stdout_lines

    # =========================================================================
    # 5. Systemd Service (optional)
    # =========================================================================
    - name: Deploy systemd service
      ansible.builtin.template:
        src: templates/golish.service.j2
        dest: /etc/systemd/system/golish.service
        mode: "0644"
      when: golish_enable_service
      notify: restart golish

    - name: Enable and start golish service
      ansible.builtin.systemd:
        name: golish
        enabled: true
        state: started
        daemon_reload: true
      when: golish_enable_service

  handlers:
    - name: restart golish
      ansible.builtin.systemd:
        name: golish
        state: restarted
        daemon_reload: true
      when: golish_enable_service
