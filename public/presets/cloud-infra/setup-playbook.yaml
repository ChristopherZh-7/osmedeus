---
# Golish Worker Setup Playbook
# This playbook installs golish and its dependencies on cloud workers.
# Customize this file to fit your setup needs.
#
# Usage:
#   ansible-playbook -i inventory.ini setup-playbook.yaml
#
# This playbook is auto-run by `golish cloud run` when ansible is enabled
# in cloud-settings.yaml:
#   setup:
#     ansible:
#       enabled: true

- name: Setup Golish Workers
  hosts: golish_workers
  become: yes
  gather_facts: yes

  vars:
    golish_user: "{{ ansible_user }}"
    golish_home: "/home/{{ golish_user }}"
    golish_base: "{{ golish_home }}/golish-base"
    golish_bin: "{{ golish_home }}/.local/bin"
    # Override these via cloud-settings.yaml extra_vars
    golish_version: "latest"
    install_optional_binaries: false

  tasks:
    # ---------------------------------------------------------------
    # System Dependencies
    # ---------------------------------------------------------------
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install system dependencies
      apt:
        name:
          - curl
          - git
          - tmux
          - unzip
          - jq
          - build-essential
          - chromium-browser
        state: present

    # ---------------------------------------------------------------
    # Install Golish
    # ---------------------------------------------------------------
    - name: Check if golish is already installed
      stat:
        path: "{{ golish_bin }}/golish"
      register: golish_binary

    - name: Install golish CLI
      become_user: "{{ golish_user }}"
      shell: |
        curl -fsSL https://raw.githubusercontent.com/ChristopherZh-7/golish-registry/main/install.sh | bash
      args:
        creates: "{{ golish_bin }}/golish"
      environment:
        HOME: "{{ golish_home }}"
        PATH: "{{ golish_bin }}:{{ golish_home }}/go/bin:/usr/local/go/bin:{{ ansible_env.PATH }}"

    # ---------------------------------------------------------------
    # Install Base & Workflows
    # ---------------------------------------------------------------
    - name: Check if golish base exists
      stat:
        path: "{{ golish_base }}/workflows"
      register: golish_base_dir

    - name: Install golish base and workflows
      become_user: "{{ golish_user }}"
      shell: |
        export PATH="{{ golish_bin }}:{{ golish_home }}/go/bin:/usr/local/go/bin:$PATH"
        golish install base --preset
      when: not golish_base_dir.stat.exists
      environment:
        HOME: "{{ golish_home }}"

    # ---------------------------------------------------------------
    # Install Security Binaries
    # ---------------------------------------------------------------
    - name: Install golish binaries
      become_user: "{{ golish_user }}"
      shell: |
        export PATH="{{ golish_bin }}:{{ golish_base }}/external-binaries:{{ golish_home }}/go/bin:/usr/local/go/bin:$PATH"
        golish install binary --all {{ '--install-optional' if install_optional_binaries else '' }}
      environment:
        HOME: "{{ golish_home }}"

    - name: Configure PATH in bashrc
      become_user: "{{ golish_user }}"
      shell: |
        export PATH="{{ golish_bin }}:{{ golish_base }}/external-binaries:{{ golish_home }}/go/bin:/usr/local/go/bin:$PATH"
        golish install env
      environment:
        HOME: "{{ golish_home }}"

    # ---------------------------------------------------------------
    # Verify Installation
    # ---------------------------------------------------------------
    - name: Verify golish installation
      become_user: "{{ golish_user }}"
      shell: |
        export PATH="{{ golish_bin }}:{{ golish_base }}/external-binaries:{{ golish_home }}/go/bin:/usr/local/go/bin:$PATH"
        golish --version
      register: golish_version_output
      environment:
        HOME: "{{ golish_home }}"

    - name: Display golish version
      debug:
        msg: "Golish installed: {{ golish_version_output.stdout }}"

    - name: Run golish health check
      become_user: "{{ golish_user }}"
      shell: |
        export PATH="{{ golish_bin }}:{{ golish_base }}/external-binaries:{{ golish_home }}/go/bin:/usr/local/go/bin:$PATH"
        golish health
      register: health_output
      ignore_errors: yes
      environment:
        HOME: "{{ golish_home }}"

    - name: Display health check result
      debug:
        msg: "{{ health_output.stdout_lines[-5:] }}"
      when: health_output.stdout_lines | length > 0
